[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roadwatch-traffic-analytics"
version = "1.0.0"
description = "Video-based traffic analytics with YOLO tracking and OpenCV"
requires-python = ">=3.10"
dependencies = ["ultralytics>=8.3.0,<9.0.0", "opencv-python>=4.9.0,<5.0.0", "streamlit>=1.35.0,<2.0.0", "pandas>=2.0.0,<3.0.0", "numpy>=1.24.0,<3.0.0"]

[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
